[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "lending-bank-gateway"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30", "asyncmy>=0.2.9", "aiosqlite>=0.20",
  "alembic>=1.13", "pymysql>=1.1", "pydantic>=2.7", "pydantic-settings>=2.3",
  "httpx>=0.27", "boto3>=1.34", "openpyxl>=3.1",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.2", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "respx>=0.21",
  "ruff>=0.4", "mypy>=1.10", "testcontainers[mysql]>=4.5", "greenlet>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration and not compat' --cov=app --cov-branch --cov-report=term-missing"
markers = [
  "integration: 需要 docker 的 MySQL 约束/迁移测试",
  "compat: 直连 wedap dev 环境的兼容性套件（nightly/里程碑手动跑，不进 CI 必跑集）",
]

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "pragma: no branch",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# FastAPI 路由函数参数默认值中使用 Depends() 是框架约定，不是真正的函数调用副作用
"app/api/v1/*.py" = ["B008"]
# alembic autogenerate 生成文件：允许旧式类型注解、长行、import 排序宽松
"alembic/versions/**" = ["UP035", "UP007", "E501", "I001", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

services:
  lending-bank-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: lending-bank-gateway
    ports:
      - "8022:8022"
    env_file:
      - env.local
    environment:
      GW_DB_URL: mysql+asyncmy://${DB_USER}:${DB_PASS}@${DB_HOST}:3306/lending_bank_gateway
      GW_WEDAP_BASE_URL: ${WEDAP_BASE_URL}
      GW_S2S_SECRET: ${GW_S2S_SECRET}
      GW_ENV: ${GW_ENV:-local}
    # Logs go to stdout (app/main.py _configure_logging); the json-file driver
    # caps on-disk growth (3 files x 50MB) so `docker logs` can't grow unbounded
    # and a platform log agent tails the container. Gateway never wrote log
    # files — this only adds the missing rotation cap.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - wedap-network
networks:
  wedap-network:
    external: true

services:
  lending-bank-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        PROJECT_ID: ${PROJECT_ID:-lending-bank-gateway}
        SERVICE_NAME: ${SERVICE_NAME:-lending-bank-gateway-api}
        APP_VERSION: ${APP_VERSION:-0.1.0}
        APP_SCHEMA_REVISION: ${APP_SCHEMA_REVISION:-d3e4f5a6b7c8_0021_platform_bank_account}
        DATA_ACTION: ${DATA_ACTION:-none}
        SOURCE_CONFIG_DIGEST: ${SOURCE_CONFIG_DIGEST:-digest_missing}
        IMAGE_DIGEST: ${IMAGE_DIGEST:-digest_missing}
    # buildops promote 以 --no-build 复用既有制品：image 指向 local-verify 产出的 APP_IMAGE。
    image: ${APP_IMAGE:-lending-bank-gateway:latest}
    container_name: lending-bank-gateway
    ports:
      - "8022:8022"
    env_file:
      - ${GW_ENV_FILE:-env.local}
    environment:
      # remote promote：.env 已带拼好的 GW_DB_URL/GW_WEDAP_BASE_URL（无未前缀 DB_*/WEDAP_BASE_URL），
      # 故优先复用 GW_ 值，回落到 local 的未前缀拼装——否则 remote compose 插值取空会清空 DB 连接串
      # 与 wedap 基址（environment 覆盖 env_file，实测 docker compose config 证实）。
      GW_DB_URL: ${GW_DB_URL:-mysql+asyncmy://${DB_USER}:${DB_PASS}@${DB_HOST}:3306/lending_bank_gateway}
      GW_WEDAP_BASE_URL: ${GW_WEDAP_BASE_URL:-${WEDAP_BASE_URL}}
      GW_S2S_SECRET: ${GW_S2S_SECRET}
      GW_ENV: ${GW_ENV:-local}
      # 运行态发布身份 env（/api/version 回显源；规范0707）。buildops promote 经上传的 .env 覆盖。
      PROJECT_ID: ${PROJECT_ID:-lending-bank-gateway}
      SERVICE_NAME: ${SERVICE_NAME:-lending-bank-gateway-api}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_TIME_HKT: ${BUILD_TIME_HKT:-}
      COLLAB_RELEASE_ID: ${COLLAB_RELEASE_ID:-not-reported}
      COLLAB_RELEASE_RUN_ID: ${COLLAB_RELEASE_RUN_ID:-not-reported}
      COLLAB_RELEASE_ENV: ${COLLAB_RELEASE_ENV:-local}
      IMAGE_DIGEST: ${IMAGE_DIGEST:-digest_missing}
      SOURCE_CONFIG_DIGEST: ${SOURCE_CONFIG_DIGEST:-digest_missing}
      APP_SCHEMA_REVISION: ${APP_SCHEMA_REVISION:-d3e4f5a6b7c8_0021_platform_bank_account}
      DATA_ACTION: ${DATA_ACTION:-none}
      # flow-import 透传（Pydantic 只认 GW_ 前缀；deploy.sh 已 set -a source env 文件，
      # 无前缀名与 GW_ 前缀名都参与替换）。嵌套默认 ${X:-${GW_X:-…}}：优先无前缀惯例名，
      # 回落 GW_ 前缀直写名——防 environment 段用空串/false 静默覆盖 env_file 里的 GW_ 条目。
      GW_WEDAP_IMPORT_BASE_URL: ${WEDAP_IMPORT_BASE_URL:-${GW_WEDAP_IMPORT_BASE_URL:-}}
      GW_WEDAP_IMPORT_API_KEY: ${WEDAP_IMPORT_API_KEY:-${GW_WEDAP_IMPORT_API_KEY:-}}
      GW_WEDAP_DELIVERY_ENABLED: ${WEDAP_DELIVERY_ENABLED:-${GW_WEDAP_DELIVERY_ENABLED:-false}}
      GW_WEDAP_PRESIGNED_ENABLED: ${WEDAP_PRESIGNED_ENABLED:-${GW_WEDAP_PRESIGNED_ENABLED:-false}}
      GW_WEDAP_STAGING_BUCKET: ${WEDAP_STAGING_BUCKET:-${GW_WEDAP_STAGING_BUCKET:-lending-wedap-staging}}
      GW_WEDAP_IMPORT_BUCKET: ${WEDAP_IMPORT_BUCKET:-${GW_WEDAP_IMPORT_BUCKET:-wedap-flow-import}}
      GW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-${GW_S3_ENDPOINT_URL:-}}
      GW_RECON_BASE_URL: ${RECON_BASE_URL:-${GW_RECON_BASE_URL:-}}
      GW_RECON_CALLBACK_HMAC_SECRET: ${RECON_CALLBACK_HMAC_SECRET:-${GW_RECON_CALLBACK_HMAC_SECRET:-}}
      # 账户守门人（FU-GW-ACCOUNT-GUARD）：与 deploy.sh remote 透传清单保持同集
      GW_ACCOUNT_GUARD_MODE: ${ACCOUNT_GUARD_MODE:-${GW_ACCOUNT_GUARD_MODE:-off}}
      GW_ADMIN_CALLERS: ${ADMIN_CALLERS:-${GW_ADMIN_CALLERS:-}}
      GW_S2S_CALLER_TOKENS: ${S2S_CALLER_TOKENS:-${GW_S2S_CALLER_TOKENS:-}}
      # AWS_* 凭证走 env_file 同名直通（boto3 标准名，无需映射）
    # Logs go to stdout (app/main.py _configure_logging); the json-file driver
    # caps on-disk growth (3 files x 100MB) so `docker logs` can't grow unbounded
    # and a platform log agent tails the container. Gateway never wrote log
    # files — this only adds the missing rotation cap.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - wedap-network
      # BFF internal proxy 的回调出口。admin-backend 撤掉 7018 宿主端口映射改多副本后，
      # 宿主网关 IP + docker-proxy 那条路会消失，只能按容器名直连 —— 而容器名解析要求
      # gateway 与 lending-console-bff 同网，故加入 lending-network。
      - lending-network
networks:
  wedap-network:
    external: true
  lending-network:
    external: true
